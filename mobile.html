<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АрбитрПро – Презентация</title>
<style>
  @font-face { font-family: 'Myriad Pro'; src: url('https://raw.githubusercontent.com/VityaMoroz/ArbitrPRO/VityaMoroz-patch-1/MYRIADPRO-REGULAR.OTF') format('opentype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Myriad Pro'; src: url('https://raw.githubusercontent.com/VityaMoroz/ArbitrPRO/VityaMoroz-patch-1/MYRIADPRO-SEMIBOLD.OTF') format('opentype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Myriad Pro'; src: url('https://raw.githubusercontent.com/VityaMoroz/ArbitrPRO/VityaMoroz-patch-1/MYRIADPRO-BOLD.OTF') format('opentype'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('https://raw.githubusercontent.com/VityaMoroz/ArbitrPRO/VityaMoroz-patch-1/Inter-Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('https://raw.githubusercontent.com/VityaMoroz/ArbitrPRO/VityaMoroz-patch-1/Inter-Medium.otf') format('opentype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('https://raw.githubusercontent.com/VityaMoroz/ArbitrPRO/VityaMoroz-patch-1/Inter-SemiBold.otf') format('opentype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('https://raw.githubusercontent.com/VityaMoroz/ArbitrPRO/VityaMoroz-patch-1/Inter-Bold.otf') format('opentype'); font-weight: 700; font-display: swap; }

  :root {
    --green: #19322E;
    --green-deep: #0F1F1C;
    --gold: #BEAC8C;
    --cream: #F7EBDD;
    --red: #C25B4E;
    --green-ok: #5FA97E;
    --intro-dur: 1.6s;
    --intro-ease: cubic-bezier(0.72, 0, 0.28, 1);
    --sync-dur: 1.2s;
    --sync-ease: linear;
    --line: rgba(190,172,140,0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--green-deep);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: var(--cream);
    overflow: hidden;
    height: 100vh; height: 100dvh;
    -webkit-text-size-adjust: 100%;
  }
  .deck {
    position: relative;
    width: 100vw; height: 100vh; height: 100dvh;
    background: radial-gradient(ellipse at 40% 50%, #1d3a35 0%, var(--green-deep) 70%);
    overflow: hidden;
    touch-action: pan-y;
  }

  /* ИНТРО */
  .intro { position: fixed; inset: 0; z-index: 100; background: var(--cream); overflow: hidden; cursor: pointer; transition: opacity 0.5s ease, visibility 0.5s ease; }
  .intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-cross { position: absolute; top: 50%; left: 50%; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity var(--intro-dur) ease; }
  .intro.expanding .intro-cross { opacity: 1; }
  .intro-cross::before, .intro-cross::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 200vmax; height: 18vh; background: rgba(190,172,140,0.6);
    transform-origin: center;
    transform: translate(-50%,-50%) rotate(45deg) scaleX(0);
    transition: transform var(--intro-dur) var(--intro-ease);
  }
  .intro-cross::after { transform: translate(-50%,-50%) rotate(-45deg) scaleX(0); }
  .intro.expanding .intro-cross::before { transform: translate(-50%,-50%) rotate(45deg) scaleX(1); }
  .intro.expanding .intro-cross::after  { transform: translate(-50%,-50%) rotate(-45deg) scaleX(1); }
  .intro-black {
    position: absolute; top: 50%; left: 50%; width: 40vmin; height: 40vmin;
    background: var(--green); transform: translate(-50%, -50%) rotate(45deg) scale(0);
    transition: transform var(--intro-dur) var(--intro-ease);
    pointer-events: none; z-index: 2;
  }
  .intro.expanding .intro-black { transform: translate(-50%, -50%) rotate(45deg) scale(10); }

  /* КРУГ-ЛОГО — на титульном и в меню */
  .pp-logo {
    position: fixed;
    top: 50%; left: 50%;
    width: 30vmin; height: 30vmin;
    transform: translate(-50%, -50%);
    z-index: 110;
    pointer-events: none;
    opacity: 0;
    transition: top var(--intro-dur) var(--intro-ease),
                left var(--intro-dur) var(--intro-ease),
                width var(--intro-dur) var(--intro-ease),
                height var(--intro-dur) var(--intro-ease),
                opacity var(--sync-dur) var(--sync-ease),
                filter var(--sync-dur) var(--sync-ease);
  }
  .pp-logo .logo-circle {
    position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
    transform: translate(-50%, -50%); object-fit: contain;
    z-index: 1;
  }
  .pp-logo.on-title {
    top: 22vh; left: 50vw;
    width: 28vmin; height: 28vmin;
    opacity: 1;
  }
  .pp-logo.in-corner-mobile {
    top: 117vh; left: 50vw;
    width: 90vh; height: 90vh;
    opacity: 0.18;
    filter: blur(4px);
    z-index: 15;
  }

  /* ДУГА — стартует из центра вместе с лого, на титульном становится вокруг лого */
  .arc {
    position: fixed;
    border: 2px solid rgba(190,172,140,0.65);
    border-radius: 50%;
    pointer-events: none;
    z-index: 30;
    top: 50%; left: 50%;
    width: 32vmin; height: 32vmin;
    margin-top: -16vmin; margin-left: -16vmin;
    opacity: 0;
    transition: top var(--intro-dur) var(--intro-ease),
                left var(--intro-dur) var(--intro-ease),
                width var(--intro-dur) var(--intro-ease),
                height var(--intro-dur) var(--intro-ease),
                margin var(--intro-dur) var(--intro-ease),
                opacity var(--sync-dur) var(--sync-ease);
  }
  /* На титульном дуга совпадает с лого */
  .arc.on-title {
    top: 22vh; left: 50vw;
    width: 30vmin; height: 30vmin;
    margin-top: -15vmin; margin-left: -15vmin;
    opacity: 1;
  }
  .arc.expanded {
    top: 117vh; left: 50vw;
    width: 70vh; height: 70vh;
    margin-top: -35vh; margin-left: -35vh;
    opacity: 1;
  }

  /* ЦЕЛЬНЫЙ ЛОГО НАД МЕНЮ */
  .brand-corner {
    position: fixed;
    top: auto; bottom: 18px; left: 50%;
    height: 9vmin;
    transform: translate(-50%, 300px);
    opacity: 0;
    z-index: 115;
    pointer-events: none;
    transition: opacity var(--sync-dur) var(--sync-ease),
                transform var(--sync-dur) var(--sync-ease);
  }
  .brand-corner.visible { transform: translate(-50%, 0); opacity: 1; }

  /* ТИТУЛЬНЫЙ */
  .title-slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 20px 20px 40px;
    z-index: 5;
    pointer-events: none;
    transition: opacity 0.6s ease;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .title-slide.gone { opacity: 0; }
  .title-left { width: 100%; height: 42vh; flex-shrink: 0; }
  .title-right {
    width: 100%; padding: 0 4px; text-align: center; align-items: center;
    display: flex; flex-direction: column; justify-content: flex-start;
    transform: translateY(40px); opacity: 0;
    transition: transform 1.2s cubic-bezier(0.2,1,0.3,1) 0.2s, opacity 0.9s ease 0.2s;
  }
  .title-right.entered { transform: translateY(0); opacity: 1; }
  .title-logo-text { height: 6vmin; margin-bottom: 22px; align-self: center; }
  .title-main {
    font-family: 'Myriad Pro', sans-serif;
    font-size: clamp(26px, 7.2vw, 36px); font-weight: 600;
    text-align: center; line-height: 1.25;
    margin: 0 0 22px;
    text-transform: uppercase; color: var(--cream);
  }
  .title-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 3.4vw, 15px);
    text-align: center;
    color: var(--gold);
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 26px;
  }
  .title-badge {
    display: inline-block;
    padding: 10px 18px;
    font-size: 11px;
    background: rgba(190,172,140,0.08);
    border: 1px solid rgba(190,172,140,0.3);
    border-radius: 4px;
    font-family: 'Myriad Pro', sans-serif;
    font-weight: 600;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    white-space: nowrap;
    align-self: center;
    opacity: 0;
    transform: translateY(20px);
    transition: transform 0.9s cubic-bezier(0.2,1,0.3,1) 0.5s, opacity 0.8s ease 0.5s;
  }
  .title-badge.entered { transform: translateY(0); opacity: 1; }

  /* МЕНЮ — контейнер на весь экран, прозрачный, только для пунктов */
  .wheel-menu {
    position: fixed;
    inset: 0;
    width: 100vw; height: 100vh;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .wheel-menu.visible { opacity: 1; }

  /* ПУНКТЫ МЕНЮ — абсолютные внутри .wheel-menu (он на весь экран) */
  .wheel-item {
    position: absolute;
    left: 0; top: 0;
    font-family: 'Myriad Pro', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; white-space: nowrap;
    line-height: 1; padding: 0;
    color: rgba(190,172,140,0.4);
    will-change: transform;
    transform: translate3d(var(--x, 50vw), var(--y, 100vh), 0) translate(-50%, -50%);
    transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1),
                color 0.5s ease, opacity 0.5s ease, font-size 0.5s ease;
    pointer-events: auto; cursor: pointer;
    z-index: 52;
  }
  .wheel-item.active {
    color: var(--cream) !important;
    font-weight: 700;
    font-size: 28px;
  }

  /* РАЗМЫТИЕ ПОД МЕНЮ */
  .wheel-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 31, 28, 0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 45;
    opacity: 0;
    transition: opacity 0.6s ease;
    -webkit-mask-image: radial-gradient(
      circle 35vh at 50vw 117vh,
      black 0,
      black calc(35vh - 1px),
      transparent calc(35vh + 1px),
      transparent 100%
    );
    mask-image: radial-gradient(
      circle 35vh at 50vw 117vh,
      black 0,
      black calc(35vh - 1px),
      transparent calc(35vh + 1px),
      transparent 100%
    );
  }
  .wheel-backdrop.visible { opacity: 1; }

  /* СЛАЙД */
  .right-zone {
    position: absolute; inset: 0;
    overflow: visible;
    z-index: 1;
    pointer-events: none;
  }
  .right-zone.visible { pointer-events: auto; }
  .right-slides { position: absolute; inset: 0; pointer-events: none; }
  .card-slot {
    position: absolute;
    top: 0; left: 0; right: 0;
    width: 100vw;
    height: 100vh;
    max-height: 100vh;
    padding: 24px 20px 50vh 20px;
    transform: translateY(120vh);
    pointer-events: none;
    transition: transform 1s cubic-bezier(0.65, 0, 0.35, 1);
    touch-action: pan-y;
    z-index: 10;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .card-slot.active { transform: translateY(0); pointer-events: auto; }
  .card-slot.centered { top: 0; transform: translateY(120vh); }
  .card-slot.centered.active { transform: translateY(0); }

  /* ЗАГОЛОВКИ */
  .slide-title {
    font-family: 'Myriad Pro', sans-serif;
    font-size: clamp(24px, 7vw, 34px); font-weight: 600; line-height: 1.15;
    text-transform: uppercase; color: var(--cream); margin-bottom: 20px;
  }
  .slide-title .hl { color: var(--gold); }
  .slide-lead {
    font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5;
    color: rgba(247,235,221,0.75); margin-bottom: 18px;
  }

  /* СЕТКИ */
  .grid { display: grid; gap: 12px; margin-top: 6px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .card { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .card h3 { font-family: 'Myriad Pro', sans-serif; font-size: 18px; font-weight: 600; color: var(--cream); margin-bottom: 8px; line-height: 1.15; }
  .card p { font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.45; color: rgba(247,235,221,0.72); }
  .card.risk { border-color: rgba(194,91,78,0.4); background: rgba(194,91,78,0.08); }
  .card.risk h3 { color: #e8a49c; }

  .proof-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 6px; }
  .proof { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-height: 100px; }
  .proof-wide { background: linear-gradient(135deg, rgba(190,172,140,0.18), rgba(190,172,140,0.04)); border-color: rgba(190,172,140,0.45); min-height: auto; }
  .proof-num { font-family: 'Myriad Pro', sans-serif; font-size: 32px; font-weight: 700; color: var(--gold); line-height: 1; margin-bottom: 8px; }
  .proof-wide .proof-num { font-size: 52px; }
  .proof-num small { font-size: .42em; font-weight: 700; opacity: .82; margin-left: 4px; }
  .proof-title { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: rgba(247,235,221,0.85); line-height: 1.3; }
  .fine { font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; color: rgba(247,235,221,0.5); margin-top: 16px; }

  .chart { margin-top: 6px; display: grid; gap: 16px; }
  .chart-row { display: grid; grid-template-columns: 80px 1fr; gap: 10px 12px; align-items: center; }
  .chart-pct { font-family: 'Myriad Pro', sans-serif; font-size: 24px; font-weight: 700; color: var(--gold); line-height: 1; }
  .chart-track { height: 32px; background: rgba(58,55,55,0.4); border-radius: 999px; overflow: hidden; }
  .chart-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), #9c8763); }
  .chart-range { grid-column: 2; font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(247,235,221,0.7); margin-top: -4px; line-height: 1.35; }

  .calc { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 6px; }
  .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-family: 'Myriad Pro', sans-serif; font-weight: 600; color: var(--gold); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .slider-value { min-width: 72px; text-align: right; color: var(--cream); font-size: 22px; font-weight: 700; font-family: 'Myriad Pro', sans-serif; }
  input[type=range] {
    width: 100%; height: 44px; margin: 4px 0 20px;
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: rgba(190,172,140,0.25); border-radius: 4px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%;
    background: var(--gold); margin-top: -12px;
    border: 3px solid var(--green-deep); box-shadow: 0 0 0 2px var(--gold);
  }

  .asset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .asset-title { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; opacity: 0.65; width: 100%; margin-bottom: 8px; }
  .asset-btn { flex: 1 1 auto; min-height: 44px; padding: 12px 14px; font-size: 14px; text-align: center; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; font-family: 'Inter', sans-serif; font-weight: 500; color: var(--cream); background: rgba(255,255,255,0.04); user-select: none; }
  .asset-btn.active { background: var(--gold); color: var(--green); border-color: var(--gold); }

  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .cc { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .lab { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.62; font-weight: 700; margin-bottom: 6px; }
  .val { font-family: 'Myriad Pro', sans-serif; font-size: 20px; font-weight: 700; color: var(--cream); line-height: 1.05; }
  .val.gold { color: var(--gold); }
  .val.green { color: var(--green-ok); }
  .sub { font-family: 'Inter', sans-serif; font-size: 11px; opacity: 0.6; margin-top: 6px; line-height: 1.3; }
  .net { display: flex; flex-direction: column; align-items: stretch; gap: 10px; background: linear-gradient(135deg, rgba(95,169,126,0.16), rgba(95,169,126,0.04)); border: 1px solid rgba(95,169,126,0.45); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .net .l { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; line-height: 1.3; }
  .net .l span { display: block; font-size: .72em; font-weight: 400; opacity: .72; margin-top: 4px; }
  .r { font-family: 'Myriad Pro', sans-serif; font-size: 32px; font-weight: 700; color: var(--green-ok); text-align: right; }
  .cashbox { display: none; background: rgba(190,172,140,0.14); border: 1px solid rgba(190,172,140,0.5); border-radius: 14px; padding: 16px 20px; margin-top: 14px; font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; color: rgba(247,235,221,0.85); }
  .cashbox.show { display: block; }
  .cashbox b { color: var(--gold); font-weight: 700; }
  .plain { margin-top: 14px; font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; opacity: 0.72; border-left: 2px solid var(--gold); padding-left: 12px; color: rgba(247,235,221,0.8); }
  .plain b { color: var(--gold); }

  .offer { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 6px; }
  .big { background: linear-gradient(135deg, rgba(190,172,140,0.12), rgba(190,172,140,0.03)); border: 1px solid rgba(190,172,140,0.4); border-radius: 20px; padding: 20px; }
  .big .t { font-family: 'Myriad Pro', sans-serif; font-size: 20px; font-weight: 600; line-height: 1.15; color: var(--cream); text-transform: uppercase; }
  .big .t em { font-style: normal; color: var(--gold); }
  .claim { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; line-height: 1.35; margin: 0 0 10px; color: var(--cream); }
  .claim span { color: var(--gold); }
  .list { list-style: none; margin: 8px 0 0; padding: 0; }
  .list li { display: flex; gap: 12px; align-items: flex-start; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.45; margin: 12px 0; color: rgba(247,235,221,0.85); }
  .list li > div { flex: 1; min-width: 0; }
  .list li b { color: var(--gold); font-weight: 700; }
  .dotmark { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); margin-top: 7px; }
  .rate-card { margin-top: 10px; border: 1px solid rgba(190,172,140,0.35); border-radius: 14px; overflow: hidden; background: rgba(0,0,0,0.12); }
  .rate-head, .rate-row { display: grid; grid-template-columns: 1.1fr .75fr 1.05fr; gap: 8px; padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; }
  .rate-head { background: rgba(190,172,140,0.14); color: var(--gold); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
  .rate-row { border-top: 1px solid rgba(190,172,140,0.18); color: rgba(247,235,221,0.9); }
  .rate-row span:nth-child(2) { color: var(--cream); }
  .rate-row span:nth-child(3) { color: var(--green-ok); }
  .rate-note { margin-top: 8px; font-family: 'Inter', sans-serif; font-size: 12px; opacity: 0.72; line-height: 1.4; color: rgba(247,235,221,0.8); }
  .steps { counter-reset: st; list-style: none; margin: 6px 0 0; padding: 0; }
  .steps li { counter-increment: st; display: flex; gap: 14px; align-items: flex-start; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.45; margin: 16px 0; color: rgba(247,235,221,0.85); }
  .steps li:before { content: counter(st); flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: rgba(190,172,140,0.18); color: var(--gold); font-weight: 700; font-size: 15px; display: grid; place-items: center; font-family: 'Myriad Pro', sans-serif; }
  .steps li b { color: var(--gold); font-weight: 700; }
  .pay-note { margin-top: 18px; font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.55; opacity: 0.65; color: rgba(247,235,221,0.7); }

  .vip-frame { border: 1px solid rgba(190,172,140,0.4); border-radius: 22px; padding: 20px 16px 16px; background: linear-gradient(165deg, rgba(190,172,140,0.06), transparent); }
  .vip-plate { display: inline-block; border: 1px solid var(--gold); color: var(--gold); padding: 7px 18px; border-radius: 999px; font-family: 'Myriad Pro', sans-serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; margin-bottom: 16px; }
  .vip-sub { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--gold); opacity: 0.9; margin: 6px 0 0; font-weight: 500; }
  .vip-rule { height: 1px; background: linear-gradient(90deg, var(--gold), rgba(190,172,140,0.15), transparent); margin: 20px 0 22px; }

(function initCalculator() {
  const volSlider = document.getElementById('volSlider');
  const volValue = document.getElementById('volValue');
  const bonusPerCaseEl = document.getElementById('bonusPerCase');
  const bonusMonthlyEl = document.getElementById('bonusMonthly');

  const totalPayoutEl = document.getElementById('totalPayout');
  const cashbox = document.getElementById('cashbox');
  const assetButtons = Array.from(document.querySelectorAll('.asset-btn'));
  let currentAsset = 0;
  if (!volSlider) return;
  function rub(amount) { return Math.round(amount).toLocaleString('ru-RU') + ' ₽'; }
  function calculate() {
    const rawVolume = parseInt(volSlider.value, 10);
    const volume = rawVolume;
    const bonusPerCase = volume >= 50 ? 3000 : 2000;
    const monthlyBonus = volume * bonusPerCase;
    const reward = currentAsset * 0.07;
    let share = 0;
    if (currentAsset > 0) {
      if (volume >= 50) share = 0.5;
      else if (currentAsset <= 1500000) share = 0.2;
      else if (currentAsset <= 3000000) share = 0.3;
      else if (currentAsset <= 5000000) share = 0.4;
      else share = 0.5;
    }
    const cashback = reward * share;
    const total = monthlyBonus + cashback;
    volValue.textContent = rawVolume >= 100 ? '>100' : rawVolume;
    bonusPerCaseEl.textContent = rub(bonusPerCase);
    bonusMonthlyEl.textContent = rub(monthlyBonus);
    cashbackCaseEl.textContent = rub(cashback);
    if (cashbackConditionEl) cashbackConditionEl.textContent = volume >= 50 ? '50% фикс' : '20–50%';
    totalPayoutEl.textContent = '+' + rub(total);
    cashbox.classList.toggle('show', volume >= 50);
  }
  assetButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      assetButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentAsset = parseInt(btn.getAttribute('data-asset'), 10);
      calculate();
    });
  });
  volSlider.addEventListener('input', calculate);
  calculate();
})();

  const stepDown  = vh * 0.045;
  const angleRad = (offset * 14) * Math.PI / 180;
  const x = cx + R * Math.sin(angleRad);
  const y = topOfArc + baseShift + Math.abs(offset) * stepDown;

  el.style.setProperty('--x', x + 'px');
  el.style.setProperty('--y', y + 'px');

  const absOff = Math.abs(offset);
  const alpha = Math.max(0, 1 - absOff * 0.2);
  el.style.opacity = alpha.toFixed(3);
  if (offset === 0) { el.classList.add('active'); el.style.color = 'var(--cream)'; }
  else { el.classList.remove('active'); el.style.color = `rgba(190,172,140,${(0.55 * alpha).toFixed(3)})`; }
}

function refreshMenuPositions() {
  if (current < 0) return;
  const activeMenuIdx = slides[current].menuIdx;
  document.querySelectorAll('.wheel-item').forEach(el => {
    const i = parseInt(el.dataset.menuIdx, 10);
    positionWheelItem(el, i - activeMenuIdx);
  });
}

function goTo(n) {
  if (n < -1) n = -1;
  if (n > totalSlides - 1) n = totalSlides - 1;
  if (n === current) return;
  current = n;
  const wm = document.getElementById('wheelMenu');
  const rz = document.getElementById('rightZone');

  if (n === -1) {
    arc.classList.remove('expanded');
    arc.classList.remove('on-title');
    wm.classList.remove('visible');
    rz.classList.remove('visible');
    wheelBackdrop.classList.remove('visible');
    ppLogo.classList.remove('in-corner-mobile');
    ppLogo.classList.remove('on-title');
    brandCorner.classList.remove('visible');
    document.getElementById('titleSlide').classList.remove('gone');
    document.querySelectorAll('.card-slot').forEach(el => el.classList.remove('active'));
    wheelVisible = false;
    return;
  }

  if (!wheelVisible) {
    ppLogo.classList.remove('on-title');
    ppLogo.classList.add('in-corner-mobile');
    arc.classList.remove('on-title');
    arc.classList.add('expanded');
    brandCorner.classList.add('visible');

    setTimeout(() => {
      wm.classList.add('visible');
      rz.classList.add('visible');
      wheelBackdrop.classList.add('visible');
      document.getElementById('titleSlide').classList.add('gone');
    }, 600);

    wheelVisible = true;
  }

  refreshMenuPositions();

  document.querySelectorAll('.card-slot').forEach(el => {
    const i = parseInt(el.dataset.slideIdx, 10);
    if (i === n) el.classList.add('active');
    else el.classList.remove('active');
  });
}

/* ТАП ПО ТИТУЛЬНОМУ */
document.getElementById('titleSlide').addEventListener('click', () => {
  if (current === -1) goTo(0);
});

/* СВАЙП — только от середины экрана */
const deck = document.getElementById('deck');
const EDGE_GUARD = 40;
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let swipeDirection = null;
let fromEdge = false;
const SWIPE_MIN_DISTANCE = 60;
const SWIPE_MAX_TIME = 600;

deck.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  const x = e.touches[0].clientX;
  touchStartX = x;
  touchStartY = e.touches[0].clientY;
  touchStartTime = Date.now();
  swipeDirection = null;
  fromEdge = (x < EDGE_GUARD) || (x > window.innerWidth - EDGE_GUARD);
}, { passive: true });

deck.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 1) return;
  if (swipeDirection) return;
  const dx = Math.abs(e.touches[0].clientX - touchStartX);
  const dy = Math.abs(e.touches[0].clientY - touchStartY);
  if (dx > 12 || dy > 12) {
    swipeDirection = dx > dy ? 'horizontal' : 'vertical';
  }
}, { passive: true });

deck.addEventListener('touchend', (e) => {
  if (e.changedTouches.length !== 1) return;
  if (fromEdge) return;
  if (swipeDirection !== 'horizontal') return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  if (dt > SWIPE_MAX_TIME) return;
  if (Math.abs(dx) < SWIPE_MIN_DISTANCE) return;
  if (Math.abs(dx) < Math.abs(dy)) return;
  if (dx < 0) {
    if (current === -1) goTo(0);
    else if (current < totalSlides - 1) goTo(current + 1);
  } else {
    if (current > 0) goTo(current - 1);
    else if (current === 0) goTo(-1);
  }
}, { passive: true });

window.addEventListener('resize', () => { refreshMenuPositions(); });
</script>
