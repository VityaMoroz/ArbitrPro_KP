<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>АрбитрПро – Презентация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #19322E;
    --green-deep: #0F1F1C;
    --gold: #BEAC8C;
    --cream: #F7EBDD;
    --white: #FFFFFF;
    --red: #C25B4E;
    --green-ok: #5FA97E;
    --intro-dur: 1.6s;
    --intro-ease: cubic-bezier(0.72, 0, 0.28, 1);
    --circle-cx: 20vw;
    --circle-size: 38vmin;
    --logo-size: 30vmin;
    --line: rgba(190,172,140,0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--green-deep);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: var(--cream);
    overflow: hidden;
    height: 100vh;
  }
  .deck {
    position: relative;
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at 40% 50%, #1d3a35 0%, var(--green-deep) 70%);
    overflow: hidden;
  }

  /* ИНТРО */
  .intro { position: fixed; inset: 0; z-index: 100; background: var(--cream); overflow: hidden; cursor: pointer; transition: opacity 0.5s ease, visibility 0.5s ease; }
  .intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-cross { position: absolute; top: 50%; left: 50%; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity var(--intro-dur) ease; }
  .intro.expanding .intro-cross { opacity: 1; }
  .intro-cross::before, .intro-cross::after {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 200vmax; height: 18vh; background: rgba(190,172,140,0.6);
    transform-origin: center;
    transform: translate(-50%,-50%) rotate(45deg) scaleX(0);
    transition: transform var(--intro-dur) var(--intro-ease);
  }
  .intro-cross::after { transform: translate(-50%,-50%) rotate(-45deg) scaleX(0); }
  .intro.expanding .intro-cross::before { transform: translate(-50%,-50%) rotate(45deg) scaleX(1); }
  .intro.expanding .intro-cross::after  { transform: translate(-50%,-50%) rotate(-45deg) scaleX(1); }
  .intro-black {
    position: absolute; top: 50%; left: 50%; width: 40vmin; height: 40vmin;
    background: var(--green); transform: translate(-50%, -50%) rotate(45deg) scale(0);
    transition: transform var(--intro-dur) var(--intro-ease);
    pointer-events: none; z-index: 2;
  }
  .intro.expanding .intro-black { transform: translate(-50%, -50%) rotate(45deg) scale(10); }

  /* ЛОГО */
  .pp-logo {
    position: fixed; top: 50%; left: 50%; width: 30vmin; height: 30vmin;
    transform: translate(-50%, -50%); z-index: 110; pointer-events: none;
    transition: top var(--intro-dur) var(--intro-ease), left var(--intro-dur) var(--intro-ease),
                width var(--intro-dur) var(--intro-ease), height var(--intro-dur) var(--intro-ease),
                opacity 0.4s ease;
  }
  .pp-logo .logo-diamond {
    position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
    background: var(--gold); transform: translate(-50%, -50%) rotate(45deg);
    transition: background var(--intro-dur) var(--intro-ease), opacity var(--intro-dur) ease;
  }
  .pp-logo .logo-circle {
    position: absolute; top: 50%; left: 50%; width: 72%; height: 72%;
    transform: translate(-50%, -50%); object-fit: contain;
    transition: width var(--intro-dur) var(--intro-ease), height var(--intro-dur) var(--intro-ease);
  }
  .pp-logo.on-title { top: 50%; left: var(--circle-cx); width: var(--logo-size); height: var(--logo-size); }
  .pp-logo.on-title .logo-circle { width: 100%; height: 100%; }
  .pp-logo.on-title .logo-diamond { background: var(--green); opacity: 0; }
  .pp-logo.hidden-in-wheel { opacity: 0; }

  /* ДУГА */
  .arc {
    position: absolute; border: 1px solid rgba(190,172,140,0.35); border-radius: 50%;
    pointer-events: none; z-index: 30; top: 50%; left: var(--circle-cx);
    width: var(--circle-size); height: var(--circle-size);
    margin-top: calc(var(--circle-size) / -2); margin-left: calc(var(--circle-size) / -2);
    opacity: 0;
    transition: top 1s cubic-bezier(0.72, 0, 0.28, 1), left 1s cubic-bezier(0.72, 0, 0.28, 1),
                width 1s cubic-bezier(0.72, 0, 0.28, 1), height 1s cubic-bezier(0.72, 0, 0.28, 1),
                margin 1s cubic-bezier(0.72, 0, 0.28, 1), opacity var(--intro-dur) ease;
  }
  .arc.visible { opacity: 1; }
  .arc.expanded { top: 50%; left: -78vw; width: 106vw; height: 106vw; margin-top: -53vw; margin-left: 0; }
  .arc-fill {
    position: absolute; background: var(--green-deep); border-radius: 50%;
    pointer-events: none; z-index: 20; top: 50%; left: var(--circle-cx);
    width: var(--circle-size); height: var(--circle-size);
    margin-top: calc(var(--circle-size) / -2); margin-left: calc(var(--circle-size) / -2);
    opacity: 0;
    transition: top 1s cubic-bezier(0.72, 0, 0.28, 1), left 1s cubic-bezier(0.72, 0, 0.28, 1),
                width 1s cubic-bezier(0.72, 0, 0.28, 1), height 1s cubic-bezier(0.72, 0, 0.28, 1),
                margin 1s cubic-bezier(0.72, 0, 0.28, 1), opacity 0.4s ease;
  }
  .arc-fill.expanded { top: 50%; left: -78vw; width: 106vw; height: 106vw; margin-top: -53vw; margin-left: 0; opacity: 1; }

  /* ТИТУЛЬНЫЙ */
  .title-slide { position: absolute; inset: 0; display: flex; z-index: 5; pointer-events: none; transition: opacity 0.6s ease; }
  .title-slide.gone { opacity: 0; }
  .title-left { width: 42%; }
  .title-right {
    width: 58%; display: flex; flex-direction: column; justify-content: center;
    padding-left: 1vw; padding-right: 4vw;
    transform: translateX(60%); opacity: 0;
    transition: transform 1.2s cubic-bezier(0.2,1,0.3,1) 0.2s, opacity 0.9s ease 0.2s;
  }
  .title-right.entered { transform: translateX(0); opacity: 1; }
  .title-logo-text { height: 8vmin; object-fit: contain; align-self: flex-start; margin-bottom: 28px; filter: brightness(1.05); }
  .title-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(42px, 4.6vw, 72px); font-weight: 700; line-height: 1.05;
    letter-spacing: 0.5px; color: var(--cream); margin-bottom: 22px; text-transform: uppercase;
  }
  .title-sub { font-family: 'Inter', sans-serif; font-size: clamp(15px, 1.3vw, 21px); color: var(--gold); font-weight: 500; }
  .title-badge {
    position: absolute; bottom: 40px; right: 6vw; padding: 12px 26px;
    background: rgba(190,172,140,0.08); border: 1px solid rgba(190,172,140,0.3);
    border-radius: 4px; font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(15px,1.1vw,18px); font-weight: 600; color: var(--gold);
    text-transform: uppercase; letter-spacing: 1.5px;
    transform: translateX(60%); opacity: 0;
    transition: transform 1.2s cubic-bezier(0.2,1,0.3,1) 0.4s, opacity 0.9s ease 0.4s;
  }
  .title-badge.entered { transform: translateX(0); opacity: 1; }

  /* МЕНЮ */
  .wheel-menu {
    position: absolute; left: 0; top: 0; width: 28vw; height: 100vh;
    z-index: 28; pointer-events: none; overflow: visible; opacity: 0;
    transition: opacity 0.8s ease;
  }
  .wheel-menu.visible { opacity: 1; pointer-events: auto; }
  .wheel-item {
    position: absolute; left: 0; top: 42%;
    transform-origin: -20vw 50%;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(20px, 2.1vw, 34px); font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; white-space: nowrap;
    display: flex; align-items: center; gap: 12px; line-height: 1;
    cursor: pointer; pointer-events: auto;
    transform: translateY(-50%) rotate(0deg);
    transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1), color 0.6s ease, opacity 0.6s ease;
    will-change: transform; padding-left: 3vw;
    color: rgba(190,172,140,0.35);
  }
  .wheel-item .triangle {
    width: 0; height: 0;
    border-top: 9px solid transparent; border-bottom: 9px solid transparent;
    border-left: 13px solid var(--cream); opacity: 0; flex-shrink: 0;
    transition: opacity 0.5s ease;
  }
  .wheel-item.active .triangle { opacity: 1; }
  .wheel-item.active { color: var(--cream) !important; font-weight: 700; }

  /* ПРАВАЯ ЗОНА */
  .right-zone { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  .right-zone.visible { opacity: 1; pointer-events: auto; }
  .right-slides { position: absolute; inset: 0; pointer-events: none; }
  .card-slot {
    position: absolute; top: 8vh; left: calc(28vw + 3vw);
    width: calc(72vw - 6vw); max-height: 84vh;
    overflow-y: auto; overflow-x: hidden; padding-right: 8px;
    transform: translateX(-130vw); opacity: 0; pointer-events: none;
    transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease;
    scrollbar-width: thin; scrollbar-color: rgba(190,172,140,0.4) transparent;
  }
  .card-slot::-webkit-scrollbar { width: 6px; }
  .card-slot::-webkit-scrollbar-thumb { background: rgba(190,172,140,0.4); border-radius: 3px; }
  .card-slot.active { transform: translateX(0); opacity: 1; pointer-events: auto; }

  /* Центрированный слайд (контакты) */
  .card-slot.centered { top: 50%; transform: translate(-130vw, -50%); }
  .card-slot.centered.active { transform: translate(0, -50%); }

  /* ЗАГОЛОВОК */
  .slide-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(28px, 2.9vw, 48px); font-weight: 700; line-height: 1.05;
    letter-spacing: 0.5px; color: var(--cream); margin-bottom: 26px;
    text-transform: uppercase; max-width: 24ch;
  }
  .slide-title .hl { color: var(--gold); }

  .slide-lead {
    font-family: 'Inter', sans-serif; font-size: clamp(13px, 1vw, 16px);
    line-height: 1.5; color: rgba(247,235,221,0.75); margin-bottom: 20px; max-width: 70ch;
  }

  /* СЕТКИ */
  .grid { display: grid; gap: 14px; margin-top: 6px; }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .g2, .g3 { grid-template-columns: 1fr; } }
  .card { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .card h3 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(18px, 1.5vw, 24px); font-weight: 600; color: var(--cream); margin-bottom: 8px; letter-spacing: 0.3px; line-height: 1.15; }
  .card p { margin: 0; font-family: 'Inter', sans-serif; font-size: clamp(13px, 1vw, 15px); line-height: 1.45; color: rgba(247,235,221,0.72); }
  .card.risk { border-color: rgba(194,91,78,0.4); background: rgba(194,91,78,0.08); }
  .card.risk h3 { color: #e8a49c; }

  /* PROOF */
  .proof-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 6px; }
  @media (max-width: 900px) { .proof-grid { grid-template-columns: repeat(2, 1fr); } }
  .proof { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-height: 100px; }
  .proof-wide { grid-column: 1 / -1; background: linear-gradient(135deg, rgba(190,172,140,0.18), rgba(190,172,140,0.04)); border-color: rgba(190,172,140,0.45); min-height: auto; }
  .proof-num { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(32px, 3.6vw, 52px); font-weight: 700; color: var(--gold); line-height: 1; margin-bottom: 8px; letter-spacing: -0.5px; }
  .proof-wide .proof-num { font-size: clamp(48px, 6vw, 84px); }
  .proof-num small { font-size: .42em; font-weight: 700; opacity: .82; margin-left: 4px; }
  .proof-title { font-family: 'Inter', sans-serif; font-size: clamp(13px, 1vw, 15px); font-weight: 500; color: rgba(247,235,221,0.85); line-height: 1.3; }
  .fine { font-family: 'Inter', sans-serif; font-size: clamp(11px, 0.85vw, 13px); line-height: 1.5; color: rgba(247,235,221,0.5); margin-top: 16px; max-width: 90ch; }

  /* CHART */
  .chart { margin-top: 6px; display: grid; gap: 16px; }
  .chart-row { display: grid; grid-template-columns: 80px 1fr; gap: 10px 12px; align-items: center; }
  .chart-pct { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(24px, 2.6vw, 38px); font-weight: 700; color: var(--gold); line-height: 1; }
  .chart-track { height: 32px; background: rgba(58,55,55,0.4); border-radius: 999px; overflow: hidden; }
  .chart-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), #9c8763); }
  .chart-range { grid-column: 2; font-family: 'Inter', sans-serif; font-size: clamp(12px, 0.9vw, 14px); color: rgba(247,235,221,0.7); margin-top: -4px; line-height: 1.35; }

  /* CALC */
  .calc { position: relative; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-top: 6px; }
  .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; color: var(--gold); font-size: clamp(13px, 1vw, 15px); letter-spacing: 1px; text-transform: uppercase; }
  .slider-value { min-width: 72px; text-align: right; color: var(--cream); font-size: clamp(20px, 1.6vw, 24px); letter-spacing: 0; font-weight: 700; }
  input[type=range] { width: 100%; accent-color: var(--gold); margin: 4px 0 16px; }
  .asset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .asset-title { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; opacity: 0.65; margin-right: 4px; }
  .asset-btn { cursor: pointer; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; color: var(--cream); background: rgba(255,255,255,0.04); user-select: none; transition: background 0.2s, color 0.2s, border-color 0.2s; }
  .asset-btn.active { background: var(--gold); color: var(--green); border-color: var(--gold); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .cc { background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .lab { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.62; font-weight: 700; margin-bottom: 8px; }
  .val { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(20px, 1.9vw, 26px); font-weight: 700; letter-spacing: -0.02em; color: var(--cream); line-height: 1.05; }
  .val.gold { color: var(--gold); }
  .val.green { color: var(--green-ok); }
  .sub { font-family: 'Inter', sans-serif; font-size: 11px; opacity: 0.6; margin-top: 6px; line-height: 1.3; }
  .net { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; background: linear-gradient(135deg, rgba(95,169,126,0.16), rgba(95,169,126,0.04)); border: 1px solid rgba(95,169,126,0.45); border-radius: 16px; padding: 16px 20px; margin-top: 14px; }
  .net .l { font-family: 'Inter', sans-serif; font-size: clamp(13px, 1.1vw, 16px); font-weight: 700; line-height: 1.3; }
  .net .l span { display: block; font-size: .72em; font-weight: 500; opacity: .72; margin-top: 4px; }
  .r { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(28px, 3vw, 40px); font-weight: 700; letter-spacing: -0.02em; color: var(--green-ok); white-space: nowrap; }
  .cashbox { display: none; background: rgba(190,172,140,0.14); border: 1px solid rgba(190,172,140,0.5); border-radius: 14px; padding: 16px 20px; margin-top: 14px; font-family: 'Inter', sans-serif; font-size: clamp(12px, 1vw, 14px); line-height: 1.5; color: rgba(247,235,221,0.85); }
  .cashbox.show { display: block; }
  .cashbox b { color: var(--gold); font-weight: 700; }
  .plain { margin-top: 14px; font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; opacity: 0.72; border-left: 2px solid var(--gold); padding-left: 12px; color: rgba(247,235,221,0.8); }
  .plain b { color: var(--gold); }

  /* OFFER */
  .offer { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; margin-top: 6px; }
  @media (max-width: 900px) { .offer { grid-template-columns: 1fr; } }
  .big { background: linear-gradient(135deg, rgba(190,172,140,0.12), rgba(190,172,140,0.03)); border: 1px solid rgba(190,172,140,0.4); border-radius: 20px; padding: 24px; }
  .big .t { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(20px, 1.9vw, 26px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--cream); }
  .big .t em { font-style: normal; color: var(--gold); }
  .claim { font-family: 'Inter', sans-serif; font-size: clamp(14px, 1.3vw, 17px); font-weight: 700; line-height: 1.35; margin: 0 0 10px; color: var(--cream); }
  .claim span { color: var(--gold); }
  .list { list-style: none; margin: 8px 0 0; padding: 0; }
  .list li { display: flex; gap: 12px; align-items: flex-start; font-family: 'Inter', sans-serif; font-size: clamp(13px, 1.1vw, 15px); line-height: 1.45; margin: 12px 0; color: rgba(247,235,221,0.85); }
  .list li > div { flex: 1; min-width: 0; }
  .list li b { color: var(--gold); font-weight: 700; }
  .dotmark { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); margin-top: 7px; }
  .rate-card { margin-top: 10px; border: 1px solid rgba(190,172,140,0.35); border-radius: 14px; overflow: hidden; background: rgba(0,0,0,0.12); }
  .rate-head, .rate-row { display: grid; grid-template-columns: 1.1fr .75fr 1.05fr; gap: 8px; padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: clamp(12px, 1vw, 13.5px); font-weight: 700; }
  .rate-head { background: rgba(190,172,140,0.14); color: var(--gold); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .rate-row { border-top: 1px solid rgba(190,172,140,0.18); color: rgba(247,235,221,0.9); font-weight: 600; }
  .rate-row span:nth-child(2) { color: var(--cream); }
  .rate-row span:nth-child(3) { color: var(--green-ok); }
  .rate-note { margin-top: 8px; font-family: 'Inter', sans-serif; font-size: 12px; opacity: 0.72; line-height: 1.4; color: rgba(247,235,221,0.8); }
  .steps { counter-reset: st; list-style: none; margin: 6px 0 0; padding: 0; }
  .steps li { counter-increment: st; display: flex; gap: 14px; align-items: flex-start; font-family: 'Inter', sans-serif; font-size: clamp(13px, 1.1vw, 15px); line-height: 1.45; margin: 16px 0; color: rgba(247,235,221,0.85); }
  .steps li:before { content: counter(st); flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: rgba(190,172,140,0.18); color: var(--gold); font-weight: 700; font-size: 15px; display: grid; place-items: center; font-family: 'Barlow Condensed', sans-serif; }
  .steps li b { color: var(--gold); font-weight: 700; }
  .pay-note { margin-top: 18px; font-family: 'Inter', sans-serif; font-size: clamp(11px, 0.9vw, 13px); line-height: 1.55; opacity: 0.65; max-width: 92ch; color: rgba(247,235,221,0.7); }

  /* VIP */
  .vip-frame { border: 1px solid rgba(190,172,140,0.4); border-radius: 22px; padding: 28px 24px 22px; background: linear-gradient(165deg, rgba(190,172,140,0.06), transparent); }
  .vip-plate { display: inline-block; border: 1px solid var(--gold); color: var(--gold); padding: 7px 18px; border-radius: 999px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin-bottom: 16px; }
  .vip-sub { font-family: 'Inter', sans-serif; font-size: clamp(14px, 1.2vw, 17px); color: var(--gold); opacity: 0.9; margin: 6px 0 0; font-weight: 500; }
  .vip-rule { height: 1px; background: linear-gradient(90deg, var(--gold), rgba(190,172,140,0.15), transparent); margin: 20px 0 22px; }
  .vip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .vip-card--wide { grid-column: span 2; }
  @media (max-width: 1100px) { .vip-grid { grid-template-columns: repeat(2, 1fr); } .vip-card--wide { grid-column: span 2; } }
  @media (max-width: 640px) { .vip-grid { grid-template-columns: 1fr; } .vip-card--wide { grid-column: span 1; } }
  .vip-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(190,172,140,0.3); border-radius: 16px; padding: 20px 18px; }
  .vip-card--gold { border-color: var(--gold); background: linear-gradient(135deg, rgba(190,172,140,0.14), rgba(190,172,140,0.03)); }
  .vip-icon { width: 44px; height: 44px; border: 1px solid rgba(190,172,140,0.45); border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; background: rgba(190,172,140,0.08); font-size: 22px; line-height: 1; }

(function initCalculator() {
  const volSlider = document.getElementById('volSlider');
  const volValue = document.getElementById('volValue');
  const bonusPerCaseEl = document.getElementById('bonusPerCase');
  const bonusMonthlyEl = document.getElementById('bonusMonthly');
  const cashbackCaseEl = document.getElementById('cashbackCase');
  const cashbackConditionEl = document.getElementById('cashbackCondition');
  const totalPayoutEl = document.getElementById('totalPayout');
  const cashbox = document.getElementById('cashbox');
  const assetButtons = Array.from(document.querySelectorAll('.asset-btn'));
  let currentAsset = 0;
  if (!volSlider) return;

  function rub(amount) { return Math.round(amount).toLocaleString('ru-RU') + ' ₽'; }

  function calculate() {
    const rawVolume = parseInt(volSlider.value, 10);
    const volume = rawVolume;
    const bonusPerCase = volume >= 50 ? 3000 : 2000;
    const monthlyBonus = volume * bonusPerCase;
    const reward = currentAsset * 0.07;
    let share = 0;
    if (currentAsset > 0) {
      if (volume >= 50) share = 0.5;
      else if (currentAsset <= 1500000) share = 0.2;
      else if (currentAsset <= 3000000) share = 0.3;
      else if (currentAsset <= 5000000) share = 0.4;
      else share = 0.5;
    }
    const cashback = reward * share;
    const total = monthlyBonus + cashback;
    volValue.textContent = rawVolume >= 100 ? '>100' : rawVolume;
    bonusPerCaseEl.textContent = rub(bonusPerCase);
    bonusMonthlyEl.textContent = rub(monthlyBonus);
    cashbackCaseEl.textContent = rub(cashback);
    cashbackConditionEl.textContent = volume >= 50 ? '50% фикс' : '20–50%';
    totalPayoutEl.textContent = '+' + rub(total);
    cashbox.classList.toggle('show', volume >= 50);
  }

  assetButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      assetButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentAsset = parseInt(btn.getAttribute('data-asset'), 10);
      calculate();
    });
  });

  volSlider.addEventListener('input', calculate);
  calculate();
})();

    document.getElementById('titleBadge').classList.add('entered');
  }, 2000);
}

/* Автозапуск через 800 мс после полной загрузки */
window.addEventListener('load', () => {
  setTimeout(startIntro, 800);
});

/* Клик или тап в любом месте — старт сразу (если ещё не начали) */
document.addEventListener('click', startIntro);
document.addEventListener('touchstart', startIntro, { passive: true });

let current = -1;
const totalSlides = slides.length;
let wheelVisible = false;

const dots = document.getElementById('dots');
for (let i = 0; i < totalSlides + 1; i++) {
  const s = document.createElement('span');
  if (i === 0) s.classList.add('active');
  s.onclick = () => goTo(i - 1);
  dots.appendChild(s);
}
function updateDots() { [...dots.children].forEach((d, i) => d.classList.toggle('active', i === current + 1)); }

const ANGLE_STEP = 8;

function positionWheelItem(el, offset) {
  const angle = offset * ANGLE_STEP;
  el.style.transform = `translateY(-50%) rotate(${angle}deg)`;
  const absOff = Math.abs(offset);
  const alpha = Math.max(0, 1 - absOff * 0.16);
  el.style.opacity = alpha.toFixed(3);
  if (offset === 0) { el.classList.add('active'); el.style.color = 'var(--cream)'; }
  else { el.classList.remove('active'); el.style.color = `rgba(190,172,140,${(0.6 * alpha).toFixed(3)})`; }
}

function goTo(n) {
  if (n < -1) n = -1;
  if (n > totalSlides - 1) n = totalSlides - 1;
  if (n === current) return;
  current = n;
  updateDots();
  const arcEl = document.getElementById('arc');
  const arcFill = document.getElementById('arcFill');
  const wm = document.getElementById('wheelMenu');
  const rz = document.getElementById('rightZone');

  if (n === -1) {
    arcEl.classList.remove('expanded');
    arcFill.classList.remove('expanded');
    wm.classList.remove('visible');
    rz.classList.remove('visible');
    ppLogo.classList.remove('hidden-in-wheel');
    document.getElementById('titleSlide').classList.remove('gone');
    wheelVisible = false;
    return;
  }

  if (!wheelVisible) {
    wm.classList.add('visible');
    rz.classList.add('visible');
    document.getElementById('titleSlide').classList.add('gone');
    ppLogo.classList.add('hidden-in-wheel');
    setTimeout(() => {
      arcEl.classList.add('expanded');
      arcFill.classList.add('expanded');
    }, 250);
    wheelVisible = true;
  }

  const activeMenuIdx = slides[n].menuIdx;
  document.querySelectorAll('.wheel-item').forEach(el => {
    const i = parseInt(el.dataset.menuIdx, 10);
    const offset = i - activeMenuIdx;
    positionWheelItem(el, offset);
  });

  document.querySelectorAll('.card-slot').forEach(el => {
    const i = parseInt(el.dataset.slideIdx, 10);
    if (i === n) el.classList.add('active');
    else el.classList.remove('active');
  });
}

function nextSlide() { goTo(current + 1); }
function prevSlide() { goTo(current - 1); }
document.addEventListener('keydown', e => {
  if (!intro.classList.contains('hidden')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
});
</script>
</body>
